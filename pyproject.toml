[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdp-mcp"
version = "0.1.0"
description = "MCP server for HTTP/HTTPS traffic interception and pentesting via mitmproxy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0",
    "mitmproxy>=10.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
cdp-mcp = "cdp_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cdp_mcp"]
